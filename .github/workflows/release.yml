name: Release

on:
  push:
    tags:
      - 'v*.*'

permissions:
  contents: write

jobs:
  # ------------------------------------------------------------------
  # Source distribution (platform-independent)
  # ------------------------------------------------------------------
  sdist:
    name: Source tarball
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install system tools
        run: sudo apt-get install -y python3-pyrcc5

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Build sdist
        run: uv build --sdist

      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  # ------------------------------------------------------------------
  # Linux .deb package
  # ------------------------------------------------------------------
  linux-deb:
    name: Linux .deb
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install system deps
        run: |
          sudo apt-get update -q
          sudo apt-get install -y ffmpeg libgl1 python3-stdeb dh-python

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Build .deb
        run: uv run python setup.py --command-packages=stdeb.command bdist_deb

      - uses: actions/upload-artifact@v4
        with:
          name: linux-deb
          path: deb_dist/*.deb

  # ------------------------------------------------------------------
  # Windows standalone (PyInstaller)
  # ------------------------------------------------------------------
  windows-exe:
    name: Windows .exe
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install ffmpeg
        run: choco install ffmpeg --no-progress -y

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Build with PyInstaller
        run: uv run pyinstaller videomorph.spec --clean

      - name: Package as zip
        run: Compress-Archive -Path dist\videomorph -DestinationPath dist\videomorph-windows-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: dist/videomorph-windows-x64.zip

  # ------------------------------------------------------------------
  # macOS .app bundle (PyInstaller)
  # ------------------------------------------------------------------
  macos-app:
    name: macOS .app
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install ffmpeg
        run: brew install ffmpeg

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Build with PyInstaller
        run: uv run pyinstaller videomorph.spec --clean

      - name: Package as zip
        run: cd dist && zip -r videomorph-macos.zip VideoMorph.app

      - uses: actions/upload-artifact@v4
        with:
          name: macos-app
          path: dist/videomorph-macos.zip

  # ------------------------------------------------------------------
  # Publish to AUR (and by extension, Chaotic-AUR)
  # ------------------------------------------------------------------
  aur:
    name: Publish to AUR
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Update PKGBUILD version and pkgrel
        run: |
          VERSION=${{ steps.version.outputs.version }}
          sed -i "s/^pkgver=.*/pkgver=$VERSION/" aur/PKGBUILD
          sed -i "s/^pkgrel=.*/pkgrel=1/" aur/PKGBUILD
          # Update source URL in .SRCINFO (full regeneration done by action)
          sed -i "s/pkgver = .*/pkgver = $VERSION/" aur/.SRCINFO
          sed -i "s/pkgrel = .*/pkgrel = 1/" aur/.SRCINFO
          sed -i "s|videomorph-.*\.tar\.gz::|videomorph-$VERSION.tar.gz::|" aur/.SRCINFO
          sed -i "s|/tags/v.*\.tar\.gz|/tags/v$VERSION.tar.gz|" aur/.SRCINFO

      - name: Publish to AUR
        uses: KSXGitHub/github-actions-deploy-aur@v3.0.1
        with:
          pkgname: videomorph
          pkgbuild: aur/PKGBUILD
          commit_username: ${{ secrets.AUR_USERNAME }}
          commit_email: ${{ secrets.AUR_EMAIL }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: "Update to v${{ steps.version.outputs.version }}"
          updpkgsums: true
          test: false

  # ------------------------------------------------------------------
  # Publish GitHub Release
  # ------------------------------------------------------------------
  publish:
    name: Publish release
    needs: [sdist, linux-deb, windows-exe, macos-app]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, 'rc') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') }}
